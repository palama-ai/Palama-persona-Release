name: Release Palama Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./PALAMA FRONT END
        run: npm ci

      - name: Build application
        working-directory: ./PALAMA FRONT END
        run: npm run build

      - name: Build Electron app
        working-directory: ./PALAMA FRONT END
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Palama Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.tar.gz

      - name: Update release feed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Release created successfully!"
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

  notify:
    name: Notify on Discord
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🚀 **Palama Desktop ${{ github.ref_name }} released!**\\nDownload: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}\"}"